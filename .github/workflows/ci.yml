name: CI Quality & DLP Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-metadata-and-compose:
    name: Validate Compose & Compile Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pyyaml

      - name: Execute JIT Metadata Compiler
        run: |
          python tools/compile-metadata.py

      - name: Check for Uncommitted Metadata Drift
        run: |
          git diff --exit-code metadata/service-catalog.json || (echo "❌ Error: metadata/service-catalog.json is out of date. Run python tools/compile-metadata.py and commit." && exit 1)

  dlp-security-scan:
    name: Zero-Leakage DLP Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Sensitive Patterns
        run: |
          echo "🔍 Scanning repository for private infrastructure leakage..."
          VIOLATIONS=0

          # Check for internal domains
          if grep -rnE "labs4it\.dev" --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "❌ DLP Violation: Found internal domain labs4it.dev"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Check for internal LAN subnets
          if grep -rnE "192\.168\.10\." --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "❌ DLP Violation: Found internal subnet 192.168.10.x"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Check for private VMID patterns
          if grep -rnE "\bCT[0-9]{3}\b" --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "❌ DLP Violation: Found internal container VMID CTxxx"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Check for private project codenames
          if grep -rnE "\b(Xoai|Dynacat|Orca)\b" --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "❌ DLP Violation: Found private codename"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "🚨 CI BLOCKED: Found $VIOLATIONS DLP leakage violation(s)!"
            exit 1
          fi

          echo "✅ DLP Security Scan Passed: Zero leaks detected."
