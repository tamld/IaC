global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["127.0.0.1:8428"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "pve-host"
    static_configs:
      - targets: ["10.0.0.10:9100"] # Replace with your Proxmox/Host IP
