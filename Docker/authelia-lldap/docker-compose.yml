services:
  lldap:
    image: lldap/lldap:v0.5.0
    container_name: lldap
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET:-GenerateRandomString32Chars!}
      - LLDAP_KEY_SEED=${LLDAP_KEY_SEED:-GenerateRandomString32Chars!}
      - LLDAP_LDAP_USER_PASS=${LLDAP_ADMIN_PASSWORD:-ChangeMeSecurePass!}
      - LLDAP_LDAP_BASE_DN=${LDAP_BASE_DN:-dc=example,dc=com}
      - LLDAP_DATABASE_URL=sqlite:///data/users.db?mode=rwc
    volumes:
      - ./lldap-data:/data
    ports:
      - "${LLDAP_WEB_PORT:-17170}:17170"
      - "${LLDAP_LDAP_PORT:-3890}:3890"
    networks:
      - auth-net

  authelia:
    image: authelia/authelia:4.38.10
    container_name: authelia
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./authelia-config:/config
    environment:
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_KEY}
    ports:
      - "${AUTHELIA_PORT:-9091}:9091"
    networks:
      - auth-net
    depends_on:
      - lldap

networks:
  auth-net:
    name: auth-net
    driver: bridge
