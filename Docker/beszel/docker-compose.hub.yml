services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BESZEL_PORT:-8090}:8090"
    volumes:
      - ./beszel-data:/beszel_data
    environment:
      - PORT=8090
      - KEY="${BESZEL_PUBLIC_KEY}"
